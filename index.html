<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <script src="index.js"></script>


        <header>
            <div class="container headerEl">
                <img src="images/logo.png" alt="Oldagram Logo" class="logoEl">
                <img src="images/user-avatar.png" alt="User Avatar" class="avatarEl">
            </div>
        </header>

        <main>
            <section>
                <div class="container userNameEl">
                    <img src="images/avatar-vangogh.jpg" alt="Avatar of young van Gogh" class="avatarEl">
                    <div class="nameEl">
                        <h2>Vincent van Gogh</h2>
                        <p>Zudert, Netherlands</p>
                    </div>
                </div>
            </section>
            <section>
                <div class="container">
                    <img src="images/post-vangogh.jpg" alt="Vincent van Gogh Portrait" class="mainImg">
                    <div id="mediaIcons">
                        <input type="image" src="images/icon-heart.png" class="socialEl" id="likesIncrement">
                        <img src="images/icon-comment.png" alt="Small black comunicator icon" class="socialEl">
                        <img src="images/icon-dm.png" alt="Small black icon of paper plane" class="socialEl">
                    </div>
                    <p class="boldEl" id="likesEl">21,492 likes</p>
                    <p><span class="boldEl">vincey 1853</span> just took a few mushrooms lol</p>
                </div>
            </section>
        </main>

    </body>
</html>
